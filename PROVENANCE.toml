# PROVENANCE.toml — origin and licence of every non-code file in this repository.
#
# Scope: every file under assets/, authoring/ and levels/. Source code, manifests
# and docs are not listed; they are covered by LICENSE-MIT / LICENSE-APACHE.
#
# Fields:
#   path     — path relative to the repository root
#   origin   — "generated by <tool>" (reproducible from code in this repo) or
#              "authored for this project" (hand-written by project contributors)
#   licence  — SPDX expression
#   role     — "test fixture" (named by a test, the golden corpus, an example or a
#              benchmark in this repo), "example" (a showcase level nothing in the
#              code names; it is creative content), or "generated sample" (an
#              input the tools can rebuild, such as the voxscene models)
#
# The licence rule: every file listed here -- generated assets, test fixtures and
# example levels alike -- is MIT OR Apache-2.0, the same terms as the code, so an
# engine user can copy any example into their own project without further
# conditions. This repository contains no CC-licensed content.
#
# The role column was computed on 2026-09-28 by searching engine/, editor/ and apps/
# for each level's file name. It is informational only; it does not change the
# licence.
#
# Every new file under assets/, authoring/ or levels/ needs an entry here. Third-party
# files (CC0 or CC BY only) also need their licence file committed next to them and an
# `attribution` field.
#
# Levels 01.lvl-08.lvl also appear, with story text, in the Terminal State game
# repository, where that game's copies are licensed CC-BY-SA-4.0. The copies in
# this repository are offered under MIT OR Apache-2.0 by the same authors.

