# deny.toml — cargo-deny configuration for the terminal3d engine+editor workspace.
# Run: cargo deny check
# Checks: advisories (RustSec), licenses, bans (duplicate deps).
#
# Workspace license: MIT OR Apache-2.0 (see workspace.package.license in
# Cargo.toml). This config started as a copy of a downstream game's deny.toml;
# the two workspaces are independent and may diverge over time.

[graph]
# All workspace members are checked.
targets = [
    # Primary ship targets
    { triple = "x86_64-pc-windows-msvc" },
    { triple = "x86_64-unknown-linux-gnu" },
]

# ─────────────────────────── Advisories (RustSec) ───────────────────────────
[advisories]
# Use the RustSec database to flag known vulnerabilities.
# `deny` = block build on a published advisory; `warn` = measure mode.
version = 2
yanked = "warn"
# NOTE: cargo-deny 0.16.4 (pre-built binary used here) cannot parse CVSS 4.0
# advisory entries (e.g. RUSTSEC-2026-0146). Running `cargo deny check` with
# the advisories check enabled will fail with a parse error. Work around:
#   - Run `cargo deny check bans licenses sources` (skip advisories) until
#     cargo-deny is upgraded to a version that supports CVSS 4.0.
#   - OR use `cargo deny check --hide-inclusion-graph advisories` with a newer
#     build of cargo-deny installed from source or via cargo-binstall.
# The recommended upgrade path is cargo-deny >= 0.17 (CVSS 4.0 support added).
# This is a tool version issue, NOT a vulnerability in our dependencies.

# ──────────────────────────── Licenses ──────────────────────────────────────
[licenses]
version = 2
# Licenses we allow in dependencies. The workspace itself is Apache-2.0.
# These cover all known deps as of the workspace lock (Bevy ecosystem, kira,
# crossterm, ratatui, glam, noise, serde, windows-sys, etc.).
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CC0-1.0",
    # OFL-1.1 appears in some font crates that ratatui transitively pulls in
    "OFL-1.1",
    # MPL-2.0: triple_buffer (via kira 0.12) — copyleft only for the crate
    # itself; the license is file-based so it does not infect our code.
    # Accept in measurement mode; verify the license implications before shipping.
    "MPL-2.0",
    # BSL-1.0 (Boost): xxhash-rust (via bevy_replicon 0.40) — permissive.
    "BSL-1.0",
]
# Confidence threshold for license detection (SPDX expression matching).
confidence-threshold = 0.8

# Packages we explicitly trust for license analysis even when detection
# is ambiguous (e.g. dual-licensed MIT/Apache with custom notices).
exceptions = []

# ─────────────────────────── Bans ───────────────────────────────────────────
[bans]
# Flag multiple versions of the same crate (common source of hidden bloat).
# `warn` = measurement mode; flip to `deny` when the workspace is cleaned up.
multiple-versions = "warn"
# Workspace-internal path deps (our own crates using `{ path = "..." }` without
# a version) are NOT wildcards in the cargo-deny sense. But workspace deps that
# use `workspace = true` without a version pin in dev-deps can appear as
# wildcards. Set to "warn" for measurement mode; tighten later.
wildcards = "warn"
# Highlight duplicate versions of load-bearing crates we absolutely want
# to keep at a single version across the whole graph.
highlight = "all"

# Crates that must never appear in the dependency graph at all.
# (study references are already kept out by being non-members; these entries
# guard against accidentally re-adding them as cargo deps).
deny = []

# Crates we explicitly allow to appear more than once.
# Measured duplicates from `cargo deny check bans` 2026-06-24:
#   glam: 0.33 (workspace) + 0.30 (bevy_reflect/bevy_math internal)
#   getrandom: 3 versions (bevy-internal, renet, libm transitive)
#   hashbrown: 3 versions (bevy-internal, indexmap, hashbrown direct)
#   rand_core: 3 versions (bevy_prng, rand, renet dependencies)
#   toml_edit / toml_datetime: 2 versions (bevy vs our workspace dep)
#   chacha20/cpufeatures: 2 versions (aead transitive, renet_netcode)
#   foldhash/spin/variadics_please/windows-link/winnow: 2 versions each
# These are all transitive conflicts from the Bevy 0.18 + renet ecosystem;
# resolution requires upstream alignment, not local changes.
skip = []
skip-tree = []

# ──────────────────────────── Sources ───────────────────────────────────────
[sources]
# Only allow deps from crates.io and our own workspace paths.
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    # bevy_lint is installed from GitHub (bevy_cli dev channel); it is a
    # dev tool, not a workspace dependency — listed here for documentation.
    # "https://github.com/TheBevyFlock/bevy_cli",
]
