[package]
name = "re_golden"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "re_golden"
path = "src/lib.rs"

[lints]
workspace = true

# The golden-framebuffer harness needs exactly the crates its render path
# uses — engine crates only, so it has no dependency on any host game crate.
# `sha2` is the hashing crate, pinned to 0.11 (same `Digest`/
# `Sha256::new().update()/.finalize()` surface as 0.10).
[dependencies]
re_core = { workspace = true }
re_level = { workspace = true }
re_render = { workspace = true }
re_world = { workspace = true }
sha2 = "0.11"

[dev-dependencies]
